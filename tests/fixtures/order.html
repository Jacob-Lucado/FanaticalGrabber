<!doctype html>
<!-- A cut-down order page with the parts the extension reads: the header cells, one article per game, a Reveal Key
     button, and the key box Fanatical swaps in once a key is revealed. The tests fake the swap. -->
<html><head><title>Order</title></head><body>
<div class="order-header">
  <div class="column-cell">FAN-12345</div><div class="column-cell">November 3, 2026</div><div class="column-cell">Complete</div><div class="column-cell">$9.00</div>
</div>
<article><h3>Hades</h3><button>Reveal Key</button></article>
<article><h3>Celeste</h3><button> reveal key </button></article>
<article><h3>GOG Game</h3><button>Reveal Key</button></article>
<article><h3>Already Shown</h3><input aria-label="reveal-key" value="ZZZZZ-YYYYY-XXXXX"></article>
<button>Add to basket</button>
</body></html>
