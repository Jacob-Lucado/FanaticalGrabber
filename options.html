<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FanaticalGrabber options</title>
<style>
  body { margin: 0; background: #161616; color: #eee; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #ff9800; }
  p.lead { margin: 0 0 18px; color: #bbb; }
  label.field { display: block; margin: 0 0 16px; }
  label.field b { display: block; margin-bottom: 4px; }
  label.field small { display: block; color: #aaa; margin-top: 4px; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font: inherit; }
  label.check { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { cursor: pointer; border: 0; border-radius: 6px; padding: 9px 16px; font: 600 14px "Segoe UI", system-ui, sans-serif; }
  #save { background: #ff9800; color: #000; }
  #reset, #forget { background: #333; color: #eee; }
  #note { color: #9be29b; min-height: 1.5em; }
  hr { border: 0; border-top: 1px solid #333; margin: 22px 0; }
  code { background: #262626; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>FanaticalGrabber options</h1>
  <p class="lead">These are saved in this browser only.</p>

  <label class="field"><b>Export file name</b>
    <input type="text" id="fileName" maxlength="80">
    <small>You can use <code>{date}</code>, <code>{time}</code>, <code>{order}</code> (the order number) and <code>{count}</code> (how many keys). The file type is added for you.</small>
  </label>
  <label class="field"><b>Copy to clipboard as</b>
    <input type="text" id="clipboardFormat" maxlength="120">
    <small>One line per key. You can use <code>{title}</code>, <code>{key}</code>, <code>{order}</code> and <code>{platform}</code>.</small>
  </label>
  <label class="check"><input type="checkbox" id="extraColumns"><span><b>Add order columns to exports</b><br><small>Order number, order date and platform (Steam or other) in the CSV, Excel, JSON, Markdown and HTML files.</small></span></label>
  <label class="field"><b>Pause between Reveal Key clicks (milliseconds)</b>
    <input type="number" id="revealDelayMs" min="50" max="2000" step="10">
    <small>Raise it if Fanatical misses some keys on a slow connection.</small>
  </label>
  <label class="field"><b>Pause between keys sent to Steam (milliseconds)</b>
    <input type="number" id="redeemDelayMs" min="3000" max="30000" step="500">
    <small>Never less than 3000. Steam blocks accounts that redeem too quickly.</small>
  </label>
  <label class="field"><b>Reveal button text</b>
    <input type="text" id="revealLabel" maxlength="60" placeholder="Reveal Key">
    <small>Only needed if Reveal All finds nothing because your Fanatical is in a language the extension doesn't know. Type the button's text exactly as the page shows it.</small>
  </label>
  <div class="row"><button id="save" type="button">Save</button><button id="reset" type="button">Back to defaults</button><span id="note" role="status"></span></div>

  <hr>
  <p class="lead" id="ledgerInfo"></p>
  <div class="row"><button id="forget" type="button">Forget the keys from other orders</button></div>
</main>
<script src="lib.js"></script>
<script src="options.js"></script>
</body>
</html>
